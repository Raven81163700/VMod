name: Build VMod

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout VMod (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout VS2 (Raven81163700/Valkyrien-Skies-2-shipyard)
        uses: actions/checkout@v4
        with:
          repository: Raven81163700/Valkyrien-Skies-2-shipyard
          path: vs2

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrappers executable
        run: chmod +x gradlew vs2/gradlew Valkyrien-Ship-Schematics/gradlew

      - name: Publish VSS 2.0 to Maven local
        working-directory: Valkyrien-Ship-Schematics
        run: ./gradlew :common:publishToMavenLocal :fabric:publishToMavenLocal :forge:publishToMavenLocal --no-daemon

      - name: Publish VS2 2.5.0 to Maven local
        working-directory: vs2
        run: ./gradlew :common:publishToMavenLocal :fabric:publishToMavenLocal :forge:publishToMavenLocal -PCustomReleaseVersion=release/2.5.0 --no-daemon

      - name: Build VMod
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VMod-${{ github.run_number }}
          path: |
            fabric/build/libs/*.jar
            forge/build/libs/*.jar
